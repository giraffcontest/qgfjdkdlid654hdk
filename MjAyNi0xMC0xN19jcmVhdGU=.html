	        <script>
	function createErrorPage(message) {
	    return `
	        <!DOCTYPE html>
	        <html>
	        <head>
	            <style>
	                body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; background-color: #f8f9fa; color: #dc3545; }
	                .error-container { text-align: center; padding: 20px; border: 2px solid #dc3545; border-radius: 10px; background-color: white; max-width: 80%; }
	                h1 { font-size: 24px; margin-bottom: 10px; }
	            </style>
	        </head>
	        <body>
	            <div class="error-container">
	                <h1>${message}</h1>
	                <p>Пожалуйста, запросите новую ссылку</p>
	            </div>
	        </body>
	        </html>
	    `;
	}

	document.addEventListener('DOMContentLoaded', function() {
	    const urlParams = new URLSearchParams(window.location.search);
	    const trustedParam = urlParams.get('t');

	    if (trustedParam !== '1') {
	        document.write(createErrorPage('Ошибка загрузки.'));
	        document.close();
	        return; 
	    } else {
	        document.body.classList.remove('pre-check');
	    }
	});
	</script>

	    <body class="pre-check">
	        <div class="page">
	            <br>
	            <div class="info_middle2" style="--accent-color: #D00903">
	                <div class="info_middle-left2">
	                    <br>
	                    <p>Выберите тематики, которые вас интересуют:</p>
	                    <br>
	                    <div class="buttons">
	                        
	                    </div>
	                    <br>
	                    <p>Выберите город:</p>
	                    <br>
	                    <select name="cities" id="city-select">
	                        <option class="btn" data-filter="city_all">Все города</option>

	                    </select>
	                    <br>
	                </div>
	            </div>
	            <br>
	            <div class="info_middle2" style="--accent-color: #D00903">
	                <div class="info_middle-left2">
	                    <div id="search-container">
	                        <input type="text" id="search-input" placeholder="Поиск по тексту в постах...">
	                        <div id="search-results"></div>
	                    </div>
	                </div>
	            </div>
	            <br>
	            <div class="posts">

	    <script>
	$(document).ready(function() {
	    const observer = new IntersectionObserver((entries, observer) => {
	        entries.forEach(entry => {
	            if (entry.isIntersecting) {
	                const img = entry.target;
	                img.src = img.getAttribute('data-src');
	                observer.unobserve(img);
	            }
	        });
	    }, { rootMargin: '0px 0px 2000px 0px' });
	    $('.lazy').each(function() { observer.observe(this); });

	    $('.btn').click(function() {
	        $(this).toggleClass('active');
	        let filters = [];
	        $('.btn.active').each(function() { filters.push($(this).data('filter')); });
	        $('.post').each(function() {
	            let post = $(this);
	            let show = filters.length === 0;
	            for (let i = 0; i < filters.length; i++) {
	                if (post.hasClass(filters[i])) { show = true; break; }
	            }
	            if (show) post.addClass('show'); else post.removeClass('show');
	        });
	        $(document).trigger('filterChanged');
	    });

	    $('#city-select').on('change', function() {
	        var selectedFilter = $(this).find(':selected').data('filter');
	        $('.post').each(function() {
	            var post = $(this);
	            if (selectedFilter === 'city_all' || post.hasClass(selectedFilter)) {
	                post.addClass('show');
	            } else {
	                post.removeClass('show');
	            }
	        });
	        $(document).trigger('filterChanged');
	    });
	    $('.post').addClass('show');
	});

	$(document).ready(function() {
	    const searchInput = $('#search-input');
	    const searchResults = $('#search-results');
	    const limiterData = {};
	    $('.post').each(function() {
	        const post = $(this);
	        const id = post.attr('id') || Math.random().toString(36).substr(2, 9);
	        post.attr('data-id', id);
	        const limiter = post.find('.limiter');
	        limiterData[id] = { html: limiter.html(), text: limiter.text().toLowerCase().replace(/\s+/g, ' ') };
	    });

	    const restoreOriginalState = function() {
	        $('.post').each(function() { $(this).find('.limiter').html(limiterData[$(this).attr('data-id')].html); });
	    };

	    const isFuzzyMatch = function(textWord, searchWord) {
	        if (searchWord.length <= 3) return textWord === searchWord;
	        let matches = 0;
	        const minLength = Math.min(textWord.length, searchWord.length);
	        for (let i = 0; i < minLength; i++) { if (textWord[i] === searchWord[i]) matches++; }
	        return (matches / searchWord.length) >= 0.9;
	    };

	    const containsAllWords = function(text, searchWords) {
	        const textWords = text.split(/[\s\-.,;!?]+/);
	        return searchWords.every(searchWord => text.includes(searchWord) || textWords.some(textWord => isFuzzyMatch(textWord, searchWord)));
	    };

	    const highlightMatches = function(post, searchWords) {
	        const id = post.attr('data-id');
	        const limiter = post.find('.limiter');
	        limiter.html(limiterData[id].html);
	        const walker = document.createTreeWalker(limiter.get(0), NodeFilter.SHOW_TEXT, null, false);
	        const textNodes = [];
	        while (walker.nextNode()) textNodes.push(walker.currentNode);
	        textNodes.forEach(node => {
	            const words = node.nodeValue.split(/([\s\-.,;!?]+)/);
	            const fragment = document.createDocumentFragment();
	            words.forEach(word => {
	                if (!word || /^[\s\-.,;!?]+$/.test(word)) { fragment.appendChild(document.createTextNode(word)); return; }
	                const lowerWord = word.toLowerCase();
	                let shouldHighlight = searchWords.some(sw => lowerWord === sw || (sw.length > 3 && isFuzzyMatch(lowerWord, sw)));
	                if (shouldHighlight) {
	                    const span = document.createElement('span');
	                    span.className = 'highlight'; span.textContent = word; fragment.appendChild(span);
	                } else { fragment.appendChild(document.createTextNode(word)); }
	            });
	            node.parentNode.replaceChild(fragment, node);
	        });
	    };

	    const performSearch = function() {
	        const searchTerm = searchInput.val().trim().toLowerCase();
	        if (searchTerm === '') { searchResults.text(''); restoreOriginalState(); $('.post.show').show(); return; }
	        const searchWords = searchTerm.split(/[\s\-.,;!?]+/).filter(w => w.length > 0);
	        let foundCount = 0;
	        $('.post.show').each(function() {
	            if (containsAllWords(limiterData[$(this).attr('data-id')].text, searchWords)) { 
	                highlightMatches($(this), searchWords); $(this).show(); foundCount++; 
	            } else { $(this).hide(); }
	        });
	        searchResults.text(foundCount > 0 ? `Найдено постов: ${foundCount}` : 'Ничего не найдено');
	    };

	    searchInput.on('keyup', function(e) { if (e.key === 'Enter') performSearch(); });
	    let searchTimeout;
	    searchInput.on('input', function() { clearTimeout(searchTimeout); searchTimeout = setTimeout(performSearch, 300); });
	    $(document).on('filterChanged', performSearch);
	});
	</script>
